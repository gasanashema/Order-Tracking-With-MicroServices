services:
  api-gateway:
    image: gasanashema/api-gateway:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: api-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - USERS_SERVICE_HOST=user-service
      - ORDERS_SERVICE_HOST=orders-service
      - PRODUCTS_SERVICE_HOST=product-service
    depends_on:
      - user-service
      - orders-service
      - product-service

  orders-service:
    image: gasanashema/orders-service:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: orders-service
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production

  product-service:
    image: gasanashema/product-service:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: product-service
    ports:
      - "4002:4002"
    environment:
      - NODE_ENV=production

  user-service:
    image: gasanashema/user-service:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: user-service
    ports:
      - "4003:4003"
    environment:
      - NODE_ENV=production
